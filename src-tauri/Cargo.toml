[package]
name = "pophood"
version = "0.2.0"
description = "Pophood: a read-only hardware monitor and benchmark for Windows"
edition = "2024"
license = "MIT"

[lib]
# The `_lib` suffix keeps the library name from clashing with the binary on Windows
# (https://github.com/rust-lang/cargo/issues/8519).
name = "pophood_lib"
crate-type = ["rlib"]

[build-dependencies]
tauri-build = { version = "2.7.3", features = [] }
sha2 = "0.10.9"

[dependencies]
tauri = { version = "2.12.4", features = [] }
tauri-plugin-single-instance = "2.5.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1.54", features = ["net", "io-util", "time", "sync", "macros", "rt"] }
# tauri doesn't re-export webview2-com; tauri, tauri-runtime-wry and wry all use 0.39, so the COM types unify.
webview2-com = "0.39.1"
sha2 = "0.10.9"
getrandom = "0.3.4"
windows = { version = "0.62.2", features = [
  "Win32_Foundation",
  "Win32_Security",
  "Win32_Storage_FileSystem",
  "Win32_System_Com",
  "Win32_System_Pipes",
  "Win32_System_Registry",
  "Win32_System_Threading",
  "Win32_UI_Shell",
  "Win32_UI_WindowsAndMessaging",
] }

[dev-dependencies]
# IT-14 (GetSecurityInfo) and the access-denied IT-09 case (an SDDL descriptor).
windows = { version = "0.62.2", features = ["Win32_Security_Authorization"] }

[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true
